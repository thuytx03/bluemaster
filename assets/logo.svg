<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="body" cx="40%" cy="32%" r="75%">
      <stop offset="0" stop-color="#5FB2FF"/>
      <stop offset="0.55" stop-color="#1E7CF3"/>
      <stop offset="1" stop-color="#0B4FBF"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset="1" stop-color="#F5B400"/>
    </linearGradient>
  </defs>

  <!-- soft shadow under the body -->
  <ellipse cx="256" cy="470" rx="150" ry="22" fill="#0B4FBF" opacity="0.18"/>

  <!-- body: a round blue blob -->
  <circle cx="256" cy="282" r="196" fill="url(#body)"/>
  <!-- glossy highlight -->
  <ellipse cx="190" cy="190" rx="78" ry="46" fill="#ffffff" opacity="0.18" transform="rotate(-25 190 190)"/>

  <!-- crown: the "master" mark -->
  <g transform="translate(0 -6)">
    <path d="M168 128 L168 56 L214 98 L256 36 L298 98 L344 56 L344 128 Z" fill="url(#gold)" stroke="#D99A00" stroke-width="8" stroke-linejoin="round"/>
    <rect x="160" y="118" width="192" height="30" rx="10" fill="url(#gold)" stroke="#D99A00" stroke-width="8"/>
    <circle cx="214" cy="98" r="10" fill="#FF5E7E"/>
    <circle cx="256" cy="40" r="11" fill="#3DDC97"/>
    <circle cx="298" cy="98" r="10" fill="#FF5E7E"/>
  </g>

  <!-- eyes -->
  <ellipse cx="206" cy="268" rx="40" ry="46" fill="#ffffff"/>
  <ellipse cx="306" cy="268" rx="40" ry="46" fill="#ffffff"/>
  <circle cx="214" cy="276" r="21" fill="#0F2A5A"/>
  <circle cx="314" cy="276" r="21" fill="#0F2A5A"/>
  <circle cx="222" cy="266" r="7" fill="#ffffff"/>
  <circle cx="322" cy="266" r="7" fill="#ffffff"/>

  <!-- cheeks -->
  <circle cx="148" cy="326" r="22" fill="#FF8FAB" opacity="0.6"/>
  <circle cx="364" cy="326" r="22" fill="#FF8FAB" opacity="0.6"/>

  <!-- smile -->
  <path d="M208 338 Q256 384 304 338" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
</svg>
