name: Release

# Push a tag like v1.2.0 to build the extension and publish a GitHub Release
# with the zip attached. The extension's update check reads this release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi
          # Installed extensions read version.json to learn about this release
          LATEST="$(node -p "require('./version.json').latest")"
          if [ "$TAG" != "$LATEST" ]; then
            echo "Tag v$TAG does not match version.json latest $LATEST" >&2
            exit 1
          fi
          node -e '
            const v = require("./version.json");
            const n = (s) => String(s).replace(/^v/, "").split(".").map(Number);
            const [a, b] = [n(v.min_supported ?? v.latest), n(v.latest)];
            for (let i = 0; i < Math.max(a.length, b.length); i++) {
              if ((a[i] ?? 0) > (b[i] ?? 0)) { console.error("version.json min_supported is above latest"); process.exit(1) }
              if ((a[i] ?? 0) < (b[i] ?? 0)) break;
            }
          '

      - name: Type-check and lint
        run: pnpm check

      - name: Build extension
        run: pnpm build

      - name: Package zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp build/chrome-mv3-prod.zip "dist/bluemaster-${VERSION}.zip"
          cp build/chrome-mv3-prod.zip "dist/bluemaster-latest.zip"
          (cd dist && shasum -a 256 "bluemaster-${VERSION}.zip" > "bluemaster-${VERSION}.zip.sha256")

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Bluemaster for Facebook ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/bluemaster-*.zip
            dist/bluemaster-*.zip.sha256
